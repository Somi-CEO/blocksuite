name: Grant Somi Repo Package Access

# Allow GITHUB_TOKEN in somi-co/somi Actions to install @somi-co/blocksuite-* packages.
on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  grant:
    if: github.repository == 'somi-co/blocksuite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Grant somi-co/somi Actions access to packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_ID=$(gh api repos/somi-co/somi --jq .id)
          echo "Somi repo id=${REPO_ID}"
          names=$(jq -r '.packages[]' scripts/somi/published-packages.json | sed 's#@somi-co/##')
          ok=0
          fail=0
          for name in $names; do
            echo "Granting Actions access: ${name} -> somi-co/somi"
            gh api --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/orgs/somi-co/packages/npm/${name}/actions/permissions" \
              -f access=selected \
              -F allowed=true \
              || true
            if gh api --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/orgs/somi-co/packages/npm/${name}/actions/permissions/repositories/${REPO_ID}"; then
              ok=$((ok + 1))
            else
              echo "::warning::Failed granting ${name}"
              fail=$((fail + 1))
            fi
          done
          echo "ok=${ok} fail=${fail}"
          test "$ok" -gt 0
