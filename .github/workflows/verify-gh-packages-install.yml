name: Verify GH Packages Install

# Smoke: install published @somi-ceo/blocksuite-* packages.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to fetch
        required: true
        default: 0.19.5-somi.0

permissions:
  contents: read
  packages: read

jobs:
  verify:
    if: github.repository == 'Somi-CEO/blocksuite'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@somi-ceo'

      - name: Install store + presets + blocks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          PKG_VERSION: ${{ github.event.inputs.version }}
        run: |
          mkdir -p /tmp/pkgtest && cd /tmp/pkgtest
          npm init -y
          npm install \
            "@somi-ceo/blocksuite-store@${PKG_VERSION}" \
            "@somi-ceo/blocksuite-presets@${PKG_VERSION}" \
            "@somi-ceo/blocksuite-blocks@${PKG_VERSION}"
          node -e "console.log(require('@somi-ceo/blocksuite-store/package.json').version)"
          node -e "console.log(require('@somi-ceo/blocksuite-presets/package.json').version)"
          node -e "console.log(require('@somi-ceo/blocksuite-blocks/package.json').version)"
